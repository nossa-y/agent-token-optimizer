name: Bug Report
description: Report a reproducible problem with Agent Token Optimizer.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private source code, full cache contents, or private host config files.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit SHA.
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Manual CLI
        - Advanced MCP server
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Use a minimal non-sensitive fixture where possible.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description:
        Paste redacted `agent-token-optimizer doctor --json` output if relevant.
      render: json
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and host version.
      placeholder: "macOS 15, Node 20.11, Codex ..."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label:
            I removed secrets, private source, prompts, cache contents, and host config
            values.
          required: true
        - label: I searched existing issues for this problem.
          required: true
